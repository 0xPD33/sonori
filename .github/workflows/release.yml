name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for git-cliff to access previous tags

      # Pinned like ci.yml, so a release builds with the compiler that CI tested.
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Install dependencies
        run: |
          scripts/install-deps.sh
          scripts/install-deps.sh --env >> "$GITHUB_ENV"
          sudo apt-get install -y patchelf file libfuse2

      - name: Install git-cliff
        run: |
          wget https://github.com/orhun/git-cliff/releases/download/v2.7.0/git-cliff-2.7.0-x86_64-unknown-linux-gnu.tar.gz
          tar -xzf git-cliff-2.7.0-x86_64-unknown-linux-gnu.tar.gz
          sudo mv git-cliff-2.7.0/git-cliff /usr/local/bin/
          git-cliff --version

      - name: Download linuxdeploy for AppImage
        run: |
          wget https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage

      - name: Build release binary
        run: cargo build --release --verbose

      - name: Extract version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create release tarball with bundled libraries
        run: |
          VERSION=${{ steps.get_version.outputs.VERSION }}
          ARCHIVE_NAME="sonori-${VERSION}-x86_64-linux"

          mkdir -p "${ARCHIVE_NAME}/lib"

          # Copy the binary
          cp target/release/sonori "${ARCHIVE_NAME}/sonori.bin"

          # Copy documentation
          cp README.md LICENSE CONFIGURATION.md "${ARCHIVE_NAME}/"

          mkdir -p "${ARCHIVE_NAME}/share/applications" "${ARCHIVE_NAME}/share/icons" "${ARCHIVE_NAME}/share/metainfo"
          cp desktop/dev.sonori.desktop "${ARCHIVE_NAME}/share/applications/"
          cp -R desktop/icons/hicolor "${ARCHIVE_NAME}/share/icons/"
          cp desktop/dev.sonori.metainfo.xml "${ARCHIVE_NAME}/share/metainfo/"

          # Bundle ONNX Runtime libraries
          cp -P /usr/local/lib/libonnxruntime.so* "${ARCHIVE_NAME}/lib/"

          # Bundle other required libraries that may not be on all systems
          # OpenBLAS
          cp -P /usr/lib/x86_64-linux-gnu/libopenblas.so* "${ARCHIVE_NAME}/lib/" 2>/dev/null || true
          cp -P /usr/lib/x86_64-linux-gnu/openblas-pthread/libopenblas.so* "${ARCHIVE_NAME}/lib/" 2>/dev/null || true

          # PortAudio
          cp -P /usr/lib/x86_64-linux-gnu/libportaudio.so* "${ARCHIVE_NAME}/lib/" 2>/dev/null || true

          # This PortAudio needs JACK, which Arch does not install by default.
          # Current Arch ships OpenSSL 4, without libssl.so.3.
          cp -P /usr/lib/x86_64-linux-gnu/libjack.so.0* /usr/lib/x86_64-linux-gnu/libdb-5.3.so \
            /usr/lib/x86_64-linux-gnu/libssl.so.3 /usr/lib/x86_64-linux-gnu/libcrypto.so.3 "${ARCHIVE_NAME}/lib/"

          # Create wrapper script
          printf '%s\n' \
            '#!/bin/bash' \
            '# Sonori wrapper script - sets up library paths for bundled dependencies' \
            '' \
            '# Get the directory where this script is located' \
            'SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"' \
            '' \
            '# Add bundled libraries to LD_LIBRARY_PATH' \
            'export LD_LIBRARY_PATH="${SCRIPT_DIR}/lib:${LD_LIBRARY_PATH}"' \
            'export XDG_DATA_DIRS="${SCRIPT_DIR}/share:${XDG_DATA_DIRS:-/usr/local/share:/usr/share}"' \
            '' \
            '# Execute the actual binary' \
            'exec "${SCRIPT_DIR}/sonori.bin" "$@"' \
            > "${ARCHIVE_NAME}/sonori"

          chmod +x "${ARCHIVE_NAME}/sonori"

          # Create the tarball
          tar -czf "${ARCHIVE_NAME}.tar.gz" "${ARCHIVE_NAME}"
          echo "ARCHIVE_NAME=${ARCHIVE_NAME}" >> $GITHUB_ENV

      - name: Create AppImage
        run: |
          VERSION=${{ steps.get_version.outputs.VERSION }}
          APPDIR="Sonori.AppDir"

          # Create AppDir structure
          mkdir -p "${APPDIR}/usr/bin"
          mkdir -p "${APPDIR}/usr/lib"
          mkdir -p "${APPDIR}/usr/share/applications"
          mkdir -p "${APPDIR}/usr/share/icons"
          mkdir -p "${APPDIR}/usr/share/metainfo"

          # Copy binary
          cp target/release/sonori "${APPDIR}/usr/bin/"

          # Copy desktop file and icon
          cp desktop/dev.sonori.desktop "${APPDIR}/usr/share/applications/"
          # The AppImage spec allows one .desktop file in the AppDir root; linuxdeploy adds it under this same name.
          cp desktop/dev.sonori.desktop "${APPDIR}/dev.sonori.desktop"
          cp -R desktop/icons/hicolor "${APPDIR}/usr/share/icons/"
          cp desktop/icons/hicolor/512x512/apps/sonori.png "${APPDIR}/sonori.png"
          cp desktop/dev.sonori.metainfo.xml "${APPDIR}/usr/share/metainfo/"

          # Bundle ONNX Runtime
          cp -P /usr/local/lib/libonnxruntime.so* "${APPDIR}/usr/lib/"

          # Bundle other libraries
          cp -P /usr/lib/x86_64-linux-gnu/libopenblas.so* "${APPDIR}/usr/lib/" 2>/dev/null || true
          cp -P /usr/lib/x86_64-linux-gnu/openblas-pthread/libopenblas.so* "${APPDIR}/usr/lib/" 2>/dev/null || true
          cp -P /usr/lib/x86_64-linux-gnu/libportaudio.so* "${APPDIR}/usr/lib/" 2>/dev/null || true
          cp -P /usr/lib/x86_64-linux-gnu/libgfortran.so* "${APPDIR}/usr/lib/" 2>/dev/null || true
          # linuxdeploy skips JACK, but this PortAudio needs it and Arch does not install it.
          cp -P /usr/lib/x86_64-linux-gnu/libjack.so.0* /usr/lib/x86_64-linux-gnu/libdb-5.3.so "${APPDIR}/usr/lib/"

          # Create AppRun script
          printf '%s\n' \
            '#!/bin/bash' \
            '# AppRun for Sonori AppImage' \
            '' \
            'SELF=$(readlink -f "$0")' \
            'HERE=${SELF%/*}' \
            '' \
            '# Set up library path' \
            'export LD_LIBRARY_PATH="${HERE}/usr/lib:${LD_LIBRARY_PATH}"' \
            '' \
            '# Set up XDG paths for desktop integration' \
            'export XDG_DATA_DIRS="${HERE}/usr/share:${XDG_DATA_DIRS}"' \
            '' \
            '# Execute the application' \
            'exec "${HERE}/usr/bin/sonori" "$@"' \
            > "${APPDIR}/AppRun"
          chmod +x "${APPDIR}/AppRun"

          # Use linuxdeploy to bundle additional dependencies and create AppImage
          # --appdir specifies the AppDir, -e specifies the executable
          ./linuxdeploy-x86_64.AppImage \
            --appdir "${APPDIR}" \
            --executable target/release/sonori \
            --desktop-file desktop/dev.sonori.desktop \
            --icon-file desktop/icons/hicolor/512x512/apps/sonori.png \
            --output appimage || {
              # If linuxdeploy fails, create AppImage manually with appimagetool
              echo "linuxdeploy failed, trying manual AppImage creation..."
              wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
              chmod +x appimagetool-x86_64.AppImage
              ARCH=x86_64 ./appimagetool-x86_64.AppImage "${APPDIR}"
            }

          # Rename AppImage to include version
          mv Sonori*.AppImage "Sonori-${VERSION}-x86_64.AppImage" 2>/dev/null || \
            mv *.AppImage "Sonori-${VERSION}-x86_64.AppImage" 2>/dev/null || true

          echo "APPIMAGE_NAME=Sonori-${VERSION}-x86_64.AppImage" >> $GITHUB_ENV

      - name: Generate release notes
        run: |
          VERSION=${{ steps.get_version.outputs.VERSION }}
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          # Generate changelog using git-cliff
          if [ -n "$PREV_TAG" ]; then
            CHANGELOG=$(git-cliff --strip all ${PREV_TAG}..HEAD)
          else
            CHANGELOG=$(git-cliff --strip all HEAD)
          fi

          # Build release notes
          {
            echo "## Sonori v${VERSION}"
            echo ""
            echo "### Installation"
            echo ""
            echo "**AppImage (Recommended for most Linux users):**"
            echo "1. Download \`Sonori-${VERSION}-x86_64.AppImage\`"
            echo "2. Make executable: \`chmod +x Sonori-${VERSION}-x86_64.AppImage\`"
            echo "3. Run: \`./Sonori-${VERSION}-x86_64.AppImage\`"
            echo ""
            echo "**NixOS:**"
            echo '```bash'
            echo "nix run github:0xPD33/sonori"
            echo "# or"
            echo "nix profile install github:0xPD33/sonori"
            echo '```'
            echo ""
            echo "**From Release Tarball:**"
            echo "1. Download \`sonori-${VERSION}-x86_64-linux.tar.gz\`"
            echo "2. Extract: \`tar -xzf sonori-${VERSION}-x86_64-linux.tar.gz\`"
            echo "3. Run: \`./sonori-${VERSION}-x86_64-linux/sonori\`"
            echo ""
            echo "The tarball includes bundled libraries (ONNX Runtime, OpenBLAS) for broader compatibility."
            echo ""
            echo "See README.md for building from source."
            echo ""
            echo "### Changes"
            echo ""
            echo "${CHANGELOG}"
          } > release-notes.md

      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: release
          if-no-files-found: error
          path: |
            ${{ env.ARCHIVE_NAME }}.tar.gz
            ${{ env.APPIMAGE_NAME }}
            release-notes.md

  # A release goes out only when both artifacts start on each distro. This
  # catches libraries that the bundles miss and that the build host happened to have.
  smoke-test:
    name: smoke test (${{ matrix.image }})
    needs: build
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image:
          - ubuntu:24.04
          - debian:stable
          - fedora:latest
          - archlinux:latest
    steps:
      # Every desktop has ALSA and the Vulkan loader. The artifacts must bring the rest.
      - name: Install the desktop baseline
        run: |
          . /etc/os-release
          case $ID in
            ubuntu | debian) apt-get update && apt-get install -y libasound2t64 libvulkan1 libgomp1 ;;
            fedora) dnf install -y alsa-lib vulkan-loader libgomp ;;
            arch) pacman -Syu --noconfirm alsa-lib vulkan-icd-loader ;;
          esac

      - uses: actions/download-artifact@v4
        with:
          name: release

      - name: Run the AppImage
        run: |
          chmod +x Sonori-*.AppImage
          ./Sonori-*.AppImage --appimage-extract-and-run --help

      - name: Run the tarball
        run: |
          tar -xzf sonori-*-x86_64-linux.tar.gz
          ./sonori-*-x86_64-linux/sonori --help

  release:
    needs: smoke-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            sonori-*-x86_64-linux.tar.gz
            Sonori-*-x86_64.AppImage
          body_path: release-notes.md
          draft: false
          prerelease: false
