name: CI

on:
  push:
    branches:
      - master
  pull_request:

# A superseded push has nothing useful to say; don't pay for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Pinned to match rust-toolchain.toml exactly. Using a moving channel
      # here drifts from the nix dev shell, which resolves its toolchain
      # through flake.lock — that is how clippy came to pass locally and fail
      # on the runner. Bump this and rust-toolchain.toml together.
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # Same script as release.yml, distros.yml and the README.
      - name: Install dependencies
        run: |
          scripts/install-deps.sh
          scripts/install-deps.sh --env >> "$GITHUB_ENV"

      - name: Format
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test
